nodeLinker: node-modules
enableGlobalCache: true
nmMode: hardlinks-local

packageExtensions:
  # @astrojs/astro2tsx ships only a wasm32-wasi build, so it always loads
  # @napi-rs/wasm-runtime, which needs both @emnapi/core and @emnapi/runtime
  # as peers. It declares only @emnapi/core, so `astro check` fails to import
  # with ERR_MODULE_NOT_FOUND (reported misleadingly as "@astrojs/check is not
  # installed"). Remove once upstream adds the missing dependency.
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "^1.11.3"
